<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Tabel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            width: 100px;
            height: 50px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h1>Contoh Tabel HTML</h1>

<div class="container">

    <!-- Tabel 1 -->
    <table>
        <tr>
            <td>Nama</td>
            <td>Kelas</td>
            <td>Nilai</td>
        </tr>
        <tr>
            <td>Marsya</td>
            <td>XI RPL 2</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Syifa</td>
            <td>XI RPL 2</td>
            <td>88</td>
        </tr>
    </table>


    <!-- Tabel 2 -->
    <table>
        <tr>
            <td>Nama</td>
            <td>Kelas</td>
            <td rowspan="2">RPL</td>
        </tr>
        <tr>
            <td>Marsya</td>
            <td>XI</td>
        </tr>
        <tr>
            <td>Syifa</td>
            <td>XI</td>
            <td>2</td>
        </tr>
    </table>


    <!-- Tabel 3 -->
    <table>
        <tr>
            <td>Nama</td>
            <td>Kelas</td>
            <td>Jurusan</td>
        </tr>
        <tr>
            <td colspan="3">Data Siswa RPL</td>
        </tr>
        <tr>
            <td>Marsya</td>
            <td>XI</td>
            <td>RPL</td>
        </tr>
    </table>


    <!-- Tabel 4 -->
    <table>
        <tr>
            <td rowspan="2">Nama</td>
            <td>Kelas</td>
            <td>Nilai</td>
        </tr>
        <tr>
            <td>XI RPL 2</td>
            <td>90</td>
        </tr>
        <tr>
            <td colspan="2">Rata-rata</td>
            <td>90</td>
        </tr>
    </table>


    <!-- Tabel 5 -->
    <table>
        <tr>
            <td rowspan="2">Marsya</td>
            <td>HTML</td>
            <td>90</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Syifa</td>
            <td>HTML</td>
            <td>89</td>
        </tr>
    </table>

</div>

</body>
</html>
